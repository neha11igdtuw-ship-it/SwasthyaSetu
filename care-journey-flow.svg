<svg viewBox="0 0 1900 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1900" height="640" fill="#ffffff"/>

  <line x1="60" y1="330" x2="120" y2="330" stroke="#bbbbbb" stroke-width="4"/>
  <line x1="140" y1="330" x2="360" y2="330" stroke="#F26B21" stroke-width="4"/>
  <line x1="360" y1="330" x2="580" y2="330" stroke="#1B2A6B" stroke-width="4"/>
  <line x1="580" y1="330" x2="800" y2="330" stroke="#4C8C2B" stroke-width="4"/>
  <line x1="800" y1="330" x2="1020" y2="330" stroke="#7B2D8E" stroke-width="4"/>
  <line x1="1020" y1="330" x2="1240" y2="330" stroke="#F26B21" stroke-width="4"/>
  <line x1="1240" y1="330" x2="1460" y2="330" stroke="#1B2A6B" stroke-width="4"/>
  <line x1="1460" y1="330" x2="1680" y2="330" stroke="#4C8C2B" stroke-width="4"/>
  <line x1="1680" y1="330" x2="1840" y2="330" stroke="#4C8C2B" stroke-width="4"/>

  <!-- STEP 1 - Sign Up - purple (top) -->
  <g transform="translate(140,330)">
    <rect x="-85" y="-200" width="170" height="38" rx="6" fill="#7B2D8E"/>
    <text x="0" y="-175" text-anchor="middle" fill="#fff" font-size="19" font-weight="bold">Sign Up</text>
    <line x1="0" y1="-162" x2="0" y2="-46" stroke="#7B2D8E" stroke-width="3"/>
    <circle cx="0" cy="0" r="46" fill="#fff" stroke="#7B2D8E" stroke-width="6"/>
    <circle cx="0" cy="0" r="38" fill="#7B2D8E"/>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold">1</text>

    <g transform="translate(-68,-128)" fill="#7B2D8E">
      <rect x="0" y="0" width="26" height="19" rx="3" fill="none" stroke="#7B2D8E" stroke-width="2.2"/>
      <circle cx="7" cy="7" r="2.8"/>
      <path d="M2.5 16.5 Q7 12 11.5 16.5 Z"/>
      <rect x="14" y="5" width="9" height="2" rx="1"/>
      <rect x="14" y="10.5" width="9" height="2" rx="1"/>
    </g>
    <text x="-34" y="-118" font-size="15" fill="#222">• Verify mobile via OTP</text>
    <text x="-34" y="-96" font-size="15" fill="#222">• Fill basic health profile</text>
  </g>

  <!-- STEP 2 - Login - orange (bottom) -->
  <g transform="translate(360,330)">
    <circle cx="0" cy="0" r="46" fill="#fff" stroke="#F26B21" stroke-width="6"/>
    <circle cx="0" cy="0" r="38" fill="#F26B21"/>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold">2</text>
    <line x1="0" y1="46" x2="0" y2="162" stroke="#F26B21" stroke-width="3"/>
    <rect x="-85" y="162" width="170" height="38" rx="6" fill="#F26B21"/>
    <text x="0" y="187" text-anchor="middle" fill="#fff" font-size="19" font-weight="bold">Login</text>

    <g transform="translate(-68,88)" fill="#F26B21">
      <circle cx="6" cy="5" r="3"/>
      <path d="M6 9 L6 18 M6 12 L0.5 15.5 M6 12 L12 10.5 M6 18 L2.5 26 M6 18 L9.5 25.5" stroke="#F26B21" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>
    <text x="-34" y="98" font-size="15" fill="#222">• Add pregnancy/health data</text>
    <text x="-34" y="120" font-size="15" fill="#222">• Upload prior records</text>
  </g>

  <!-- STEP 3 - Report Symptoms - navy (top) -->
  <g transform="translate(580,330)">
    <rect x="-100" y="-200" width="200" height="38" rx="6" fill="#1B2A6B"/>
    <text x="0" y="-175" text-anchor="middle" fill="#fff" font-size="19" font-weight="bold">Report Symptoms</text>
    <line x1="0" y1="-162" x2="0" y2="-46" stroke="#1B2A6B" stroke-width="3"/>
    <circle cx="0" cy="0" r="46" fill="#fff" stroke="#1B2A6B" stroke-width="6"/>
    <circle cx="0" cy="0" r="38" fill="#1B2A6B"/>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold">3</text>

    <g transform="translate(-82,-134)" fill="#1B2A6B">
      <path d="M1 1 h24 a2.6 2.6 0 0 1 2.6 2.6 v10.4 a2.6 2.6 0 0 1 -2.6 2.6 h-13 l-6 5.2 v-5.2 h-3.6 a2.6 2.6 0 0 1 -2.6 -2.6 v-10.4 a2.6 2.6 0 0 1 2.6 -2.6 Z"/>
      <circle cx="8" cy="9" r="1.6" fill="#fff"/>
      <circle cx="14" cy="9" r="1.6" fill="#fff"/>
      <circle cx="20" cy="9" r="1.6" fill="#fff"/>
    </g>
    <text x="-48" y="-124" font-size="15" fill="#222">• Chat or voice input</text>
    <text x="-48" y="-102" font-size="15" fill="#222">• Describe symptoms/concerns</text>
  </g>

  <!-- STEP 4 - AI Risk Check - green (bottom) -->
  <g transform="translate(800,330)">
    <circle cx="0" cy="0" r="46" fill="#fff" stroke="#4C8C2B" stroke-width="6"/>
    <circle cx="0" cy="0" r="38" fill="#4C8C2B"/>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold">4</text>
    <line x1="0" y1="46" x2="0" y2="162" stroke="#4C8C2B" stroke-width="3"/>
    <rect x="-95" y="162" width="190" height="38" rx="6" fill="#4C8C2B"/>
    <text x="0" y="187" text-anchor="middle" fill="#fff" font-size="19" font-weight="bold">AI Risk Check</text>

    <g transform="translate(-74,92)" fill="#4C8C2B">
      <path d="M12 0 L24 21 H0 Z"/>
      <rect x="10.5" y="7.5" width="2.6" height="7.5" rx="1.3" fill="#fff"/>
      <circle cx="12" cy="17" r="1.4" fill="#fff"/>
    </g>
    <text x="-44" y="100" font-size="15" fill="#222">• Auto flags high-risk cases</text>
    <text x="-44" y="122" font-size="15" fill="#222">• Instant emergency alert</text>
  </g>

  <!-- STEP 5 - Care Referral - purple (top) -->
  <g transform="translate(1020,330)">
    <rect x="-95" y="-200" width="190" height="38" rx="6" fill="#7B2D8E"/>
    <text x="0" y="-175" text-anchor="middle" fill="#fff" font-size="19" font-weight="bold">Care Referral</text>
    <line x1="0" y1="-162" x2="0" y2="-46" stroke="#7B2D8E" stroke-width="3"/>
    <circle cx="0" cy="0" r="46" fill="#fff" stroke="#7B2D8E" stroke-width="6"/>
    <circle cx="0" cy="0" r="38" fill="#7B2D8E"/>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold">5</text>

    <g transform="translate(-76,-132)" fill="#7B2D8E">
      <rect x="0" y="5" width="22" height="15" rx="2"/>
      <rect x="9" y="0" width="3.4" height="20" fill="#fff"/>
      <rect x="0" y="10" width="22" height="3.4" fill="#fff"/>
    </g>
    <text x="-44" y="-124" font-size="15" fill="#222">• Matched to right doctor</text>
    <text x="-44" y="-102" font-size="15" fill="#222">• Facility/specialist assigned</text>
  </g>

  <!-- STEP 6 - Tele-consult - orange (bottom) -->
  <g transform="translate(1240,330)">
    <circle cx="0" cy="0" r="46" fill="#fff" stroke="#F26B21" stroke-width="6"/>
    <circle cx="0" cy="0" r="38" fill="#F26B21"/>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold">6</text>
    <line x1="0" y1="46" x2="0" y2="162" stroke="#F26B21" stroke-width="3"/>
    <rect x="-100" y="162" width="200" height="38" rx="6" fill="#F26B21"/>
    <text x="0" y="187" text-anchor="middle" fill="#fff" font-size="19" font-weight="bold">Tele-consult</text>

    <g transform="translate(-76,90)" fill="#F26B21">
      <circle cx="10" cy="5" r="4.4"/>
      <path d="M1 21 Q1 11 10 11 Q19 11 19 21 Z"/>
      <path d="M5.5 10.5 Q5.5 15 10 15 Q14.5 15 14.5 10.5" fill="none" stroke="#fff" stroke-width="1.6"/>
      <circle cx="5.5" cy="10.5" r="1.2" fill="#fff"/>
      <circle cx="14.5" cy="10.5" r="1.2" fill="#fff"/>
    </g>
    <text x="-44" y="98" font-size="15" fill="#222">• Video/chat with doctor</text>
    <text x="-44" y="120" font-size="15" fill="#222">• Download e-prescription</text>
  </g>

  <!-- STEP 7 - Care Team Chat - navy (top) -->
  <g transform="translate(1460,330)">
    <rect x="-105" y="-200" width="210" height="38" rx="6" fill="#1B2A6B"/>
    <text x="0" y="-175" text-anchor="middle" fill="#fff" font-size="19" font-weight="bold">Care Team Chat</text>
    <line x1="0" y1="-162" x2="0" y2="-46" stroke="#1B2A6B" stroke-width="3"/>
    <circle cx="0" cy="0" r="46" fill="#fff" stroke="#1B2A6B" stroke-width="6"/>
    <circle cx="0" cy="0" r="38" fill="#1B2A6B"/>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold">7</text>

    <g transform="translate(-88,-136)" fill="#1B2A6B">
      <path d="M0 1 h16 a2.2 2.2 0 0 1 2.2 2.2 v8.6 a2.2 2.2 0 0 1 -2.2 2.2 h-9 l-4.8 4.1 v-4.1 h-2.2 a2.2 2.2 0 0 1 -2.2 -2.2 v-8.6 a2.2 2.2 0 0 1 2.2 -2.2 Z"/>
      <path d="M12.6 7.2 h14.4 a2.2 2.2 0 0 1 2.2 2.2 v8.6 a2.2 2.2 0 0 1 -2.2 2.2 h-2 v4.1 l-4.6 -4.1 h-7.8 a2.2 2.2 0 0 1 -2.2 -2.2 v-4.1" fill="#F26B21"/>
    </g>
    <text x="-50" y="-124" font-size="15" fill="#222">• Message health worker</text>
    <text x="-50" y="-102" font-size="15" fill="#222">• Ask follow-up questions</text>
  </g>

  <!-- STEP 8 - Track & Follow-up - green (bottom) -->
  <g transform="translate(1680,330)">
    <circle cx="0" cy="0" r="46" fill="#fff" stroke="#4C8C2B" stroke-width="6"/>
    <circle cx="0" cy="0" r="38" fill="#4C8C2B"/>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold">8</text>
    <line x1="0" y1="46" x2="0" y2="162" stroke="#4C8C2B" stroke-width="3"/>
    <rect x="-110" y="162" width="220" height="38" rx="6" fill="#4C8C2B"/>
    <text x="0" y="187" text-anchor="middle" fill="#fff" font-size="19" font-weight="bold">Track &amp; Follow-up</text>

    <g transform="translate(-82,90)" fill="#4C8C2B">
      <rect x="0" y="2.5" width="22" height="18.5" rx="2" fill="none" stroke="#4C8C2B" stroke-width="2"/>
      <rect x="0" y="2.5" width="22" height="5.5" fill="#4C8C2B"/>
      <rect x="5" y="0" width="1.8" height="5.5"/>
      <rect x="15.2" y="0" width="1.8" height="5.5"/>
      <rect x="3.8" y="11" width="3.4" height="3.4"/>
      <rect x="9.6" y="11" width="3.4" height="3.4"/>
      <rect x="15.4" y="11" width="3.4" height="3.4"/>
      <rect x="3.8" y="16.2" width="3.4" height="3.4"/>
    </g>
    <text x="-44" y="98" font-size="15" fill="#222">• View status &amp; reminders</text>
    <text x="-44" y="120" font-size="15" fill="#222">• Visit &amp; care history log</text>
  </g>

  <text x="950" y="610" text-anchor="middle" font-size="14" fill="#888">Emergency alerts and Care Team Chat are available throughout the journey.</text>
</svg>
