version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: swasthyasetu_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swasthyasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-swasthyasetu}
    ports:
      # Host port 55432 chosen to avoid clashing with a locally installed Postgres on 5432.
      - "55432:5432"
    volumes:
      - swasthyasetu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swasthyasetu}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  swasthyasetu_pg_data:
