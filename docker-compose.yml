version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: swasthyasetu_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swasthyasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-swasthyasetu}
    ports:
      # Host port 55432 chosen to avoid clashing with a locally installed Postgres on 5432.
      - "55432:5432"
    volumes:
      - swasthyasetu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swasthyasetu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swasthyasetu_backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Overrides matching this compose network; anything else (JWT secret,
      # SMTP, Gemini key, etc.) is read from backend/.env.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-swasthyasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-swasthyasetu}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swasthyasetu_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  swasthyasetu_pg_data:
